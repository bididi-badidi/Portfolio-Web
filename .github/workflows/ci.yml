name: CI

on:
  pull_request:
    branches: [ dev, main ]
  push:
    branches: [ dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

env:
  # Required by app/env/server.ts and app/env/client.ts
  # These are dummy values to pass validation in CI for lint/test jobs.
  NEXT_PUBLIC_DEV_MODE: "false"
  REMINDER_API_TOKEN: "dummy-token"
  NEXT_PUBLIC_EMAILJS_SERVICE_ID: "dummy-service"
  NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: "dummy-template"
  NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: "dummy-key"
  NEXT_PUBLIC_AZURE_REMINDER_API_URL: "https://dummy-url.com"
  NEXT_PUBLIC_LOCAL_REMINDER_API_URL: "http://localhost:3000"
  AWS_REGION: "us-east-1"
  AWS_ACCESS_KEY_ID: "dummy-key-id"
  AWS_SECRET_ACCESS_KEY: "dummy-secret"
  AWS_BUCKET_NAME: "dummy-bucket"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run lint
        run: bun lint

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun test
